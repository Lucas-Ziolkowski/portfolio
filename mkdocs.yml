site_name: Portfolio
site_url: http://127.0.0.1:8000
site_author: Lucas ZIOLKOWSKI
site_description: Portfolio
repo_name: Lucas-Ziolkowski/portfolio
repo_url: https://github.com/Lucas-Ziolkowski/portfolio
copyright: Copyright © 2025 - 2026 Lucas ZIOLKOWSKI

nav:
  - Home: index.md
  - Compétences: comp.md
  - Projets:
      - projets/index.md
      - Multi-site: projets/multi-site.md
      - Cybersécurité: projets/cyber.md
      - DevCloud: projets/devcloud.md
      - Réseaux: projets/reseaux.md
  - CV: cv.md
  - Contact: contact.md

theme:
  name: material
  features:
    - content.tooltips
    - content.code.annotate
    - content.code.copy
    - content.code.select
    # Sidebar navigation désactivée globalement via CSS
    #- navigation.expand
    - navigation.footer
    #- navigation.indexes
    #- navigation.instant
    #- navigation.instant.prefetch
    #- navigation.instant.progress
    #- navigation.prune
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    # Breadcrumb désactivé sauf sur les pages projets (géré par métadonnées)
    #- navigation.path
    #- navigation.sections
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
    - content.social
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/favicon.ico
  icon:
    logo: material/account-circle
  language: fr

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

  - social:
      cards_layout: default

extra:
  layout:
    width: full
  status:
    new: Recently added
    deprecated: Deprecated
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Lucas-Ziolkowski
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/lucas-ziolkowski
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/LucasZiolkowski

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

  - abbr
  - def_list
  - footnotes

  - toc:
      permalink: true
      permalink_title: Lien permanent vers cette section

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.betterem:
      smart_enable: all

  - pymdownx.caret
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.keys

  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: Lucas-Ziolkowski
      repo: portfolio

  - pymdownx.mark
  - pymdownx.smartsymbols

  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css
